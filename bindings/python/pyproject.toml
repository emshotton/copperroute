[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "copperroute-kicad"
version = "0.1.0"
description = "The CopperRoute PCB autorouter, packaged for the KiCad plugin."
license = { text = "GPL-3.0-only" }
requires-python = ">=3.9"
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Homepage = "https://copperroute.net"
Repository = "https://github.com/emshotton/copperroute"

[tool.maturin]
python-source = "python"
module-name = "copperroute_kicad._native"
features = ["pyo3/extension-module"]
