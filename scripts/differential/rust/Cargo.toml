[package]
name = "fr-geometry-differential"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately its own workspace: this is not a member of the repo's main
# workspace (see the root Cargo.toml `exclude`). It exists only to drive the
# Java-vs-Rust differential harness in ../ and has no bearing on the crates
# that ship.
[workspace]

[dependencies]
fr-geometry = { path = "../../../crates/fr-geometry" }

[[bin]]
name = "t14"
path = "src/bin/t14.rs"

[[bin]]
name = "t15"
path = "src/bin/t15.rs"

[[bin]]
name = "t16r"
path = "src/bin/t16r.rs"

[[bin]]
name = "e15"
path = "src/bin/e15.rs"

[[bin]]
name = "d17"
path = "src/bin/d17.rs"
