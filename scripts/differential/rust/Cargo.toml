[package]
name = "fr-geometry-differential"
version = "0.1.0"
# Kept at 2021, not the repo-wide 2024: edition 2024 reserves `gen` as a
# keyword, and t14.rs/t15.rs both use `gen` as a function name (ported
# verbatim from the scratch harness). This package is excluded from every
# workspace-wide gate (fmt/clippy/test), so the edition mismatch has no
# effect on those.
edition = "2021"
publish = false

# Deliberately its own workspace: this is not a member of the repo's main
# workspace (see the root Cargo.toml `exclude`). It exists only to drive the
# Java-vs-Rust differential harness in ../ and has no bearing on the crates
# that ship.
[workspace]

[dependencies]
fr-geometry = { path = "../../../crates/fr-geometry" }
# Added for the Plan 2 Task 3 drivers (`p2t3`, `p2t3r`), which exercise
# `fr-board`'s ShapeTree against Java's ShapeTree/MinAreaTree.
fr-board = { path = "../../../crates/fr-board" }
# Added for the Plan 3 Task 2 driver (`p3t2`): Java number formatting.
fr-dsn = { path = "../../../crates/fr-dsn" }
# Added for the Plan 4 Task 9 driver (`p4t1`): the settings merge under test.
fr-settings = { path = "../../../crates/fr-settings" }
# Added for the Plan 5 Task 10 drivers (`p5t1`, `p5t2`): the design-rule checker under test.
fr-drc = { path = "../../../crates/fr-drc" }
# Added for the Plan 6 Task 3 driver (`p6t2`): `AutorouteSearchTreeExt` under test.
fr-router = { path = "../../../crates/fr-router" }
# Added for the Plan 8 Task 0 driver (`p8t0`): the timespan grammar and the timeout ladder.
fr-core = { path = "../../../crates/fr-core" }
parity = { path = "../../../tests/parity" }
serde_json = "1"

[[bin]]
name = "t14"
path = "src/bin/t14.rs"

[[bin]]
name = "t15"
path = "src/bin/t15.rs"

[[bin]]
name = "t16r"
path = "src/bin/t16r.rs"

[[bin]]
name = "e15"
path = "src/bin/e15.rs"

[[bin]]
name = "d17"
path = "src/bin/d17.rs"

[[bin]]
name = "p2t3"
path = "src/bin/p2t3.rs"

[[bin]]
name = "p2t3r"
path = "src/bin/p2t3r.rs"

# Plan 2 Task 10: ShapeSearchTree / SearchTreeManager against the real BasicBoard.
[[bin]]
name = "p2t10"
path = "src/bin/p2t10.rs"

# Plan 2 Task 11: `Board` against the real RoutingBoard.
[[bin]]
name = "p2t11"
path = "src/bin/p2t11.rs"

# Plan 2 Task 13: PlanarDelaunayTriangulation.
[[bin]]
name = "p2t13"
path = "src/bin/p2t13.rs"

# Plan 2 Task 15: the ONE randomised board-level driver, against the real RoutingBoard.
[[bin]]
name = "p2t15"
path = "src/bin/p2t15.rs"

# Plan 3 Task 2: Double.toString / Float.toString / formatPlacementRotation.
[[bin]]
name = "p3t2"
path = "src/bin/p3t2.rs"

# Plan 3 Task 3: the Specctra DSN lexer's token stream over a file.
[[bin]]
name = "p3t3"
path = "src/bin/p3t3.rs"

# Plan 3 Task 15: the DSN reader and all three writers over a whole fixture.
[[bin]]
name = "p3t15"
path = "src/bin/p3t15.rs"

# Plan 4 Task 9: the headless settings composition over the precedence matrix.
[[bin]]
name = "p4t1"
path = "src/bin/p4t1.rs"

# Plan 5 Task 10: the DRC report, report level.
[[bin]]
name = "p5t1"
path = "src/bin/p5t1.rs"

# Plan 5 Task 10: the DRC algorithm-level lists (violations, unconnected, ratsnest).
[[bin]]
name = "p5t2"
path = "src/bin/p5t2.rs"

# Plan 6 Task 17: one real board, its first `maxItems` connections through steps 1-5 of
# `AutorouteConnectionRouter.route`.
[[bin]]
name = "p6t1"
path = "src/bin/p6t1.rs"

# Plan 7 Task 1: `BoardStatistics`' score subset over a real (optionally routed) board.
[[bin]]
name = "p7t7"
path = "src/bin/p7t7.rs"

# Plan 7 Task 5: `optChangedArea` end to end over a routed board.
[[bin]]
name = "p7t3"
path = "src/bin/p7t3.rs"

# Plan 7 Task 5: `PolylineTrace`'s `ConnectionToPin` trio and the four `pullTight:844-860` calls.
[[bin]]
name = "p7t6"
path = "src/bin/p7t6.rs"

# Plan 7 Task 3 (ruling AH): the three hash-equality decisions over a scripted mutation sequence.
[[bin]]
name = "p7t10"
path = "src/bin/p7t10.rs"

# Plan 8 Task 0: `TextManager.parseTimespanString` + `RoutingJobSchedulerActionThread`'s cap.
[[bin]]
name = "p8t0"
path = "src/bin/p8t0.rs"

# Plan 8 Task 1: the whole job model — `RoutingJob`, `BoardFileDetails`, `FileFormat`, `SessionId`.
# Named `p8t1probe`, not `p8t1`: the plan reserves `p8t1` for Task 6's end-to-end SES-byte gate.
[[bin]]
name = "p8t1probe"
path = "src/bin/p8t1probe.rs"

# Plan 8 Task 2: the text-scraping `BoardStatistics(byte[], FileFormat)`, `countOccurrences` and
# the Gson JSON surface. Named `p8t2probe`, not `p8t2`: the plan reserves `p8t2` for Task 4's
# result-manifest driver.
[[bin]]
name = "p8t2probe"
path = "src/bin/p8t2probe.rs"

# Plan 8 Task 12: the MCP delta table, asserted against both programs.
[[bin]]
name = "p8t6"
path = "src/bin/p8t6.rs"

# Plan 9 Task 0: the port's twin of `scripts/gen-reference/RefWriter.java`, which
# `scripts/gen-reference.sh --from-port` drives. Not a driver pair — there is no diff to take,
# because the *generator* is what compares the two lanes — but it lives here because it is
# harness code and this is where the port's harness code lives.
[[bin]]
name = "refwriter"
path = "src/bin/refwriter.rs"
