# Router candidates. `exec` paths are relative to this file.
# Both kinds are invoked with identical Java legacy flags (see spec §3).
#
# ==================================================================================================
# What reads this file, and what does not (Plan 9 rulings BP2 and BP3)
# ==================================================================================================
#
# This is the **full** candidate table — sixteen entries, including the five head ablations and the
# seven historical release jars — and it is what an ad-hoc `bench run` uses. **Plan 9's milestones
# do NOT read it.** They read `benchmark/candidates.rs.toml`, the two-candidate table committed at
# Task 0 (ruling BP3), because a milestone comparison is `rs-main` against `java-current` and
# nothing else; running the other fourteen would cost hours to produce columns no ruling reads.
#
# ## `[candidates.rs-main]` has been live since the import, and the record said otherwise
#
# `git log -- benchmark/candidates.toml` shows **exactly one commit**: `ecc0abf`, "feat(benchmark):
# import the freerouting-bench comparison suite". The Rust candidate arrived with the suite and has
# never been edited since.
#
# It is easy to believe otherwise, because `c467758`'s subject line reads "benchmark: fix candidate
# paths for in-repo layout". **That commit changed four documentation files and no bench code at
# all** — 3 335 insertions across `benchmark/docs/plans/`, `benchmark/docs/specs/` and two files
# under `benchmark/reports/`, and not one line of this table. Do not infer from its subject that any
# candidate path was ever repaired; nothing was, because nothing was broken.
#
# The stale `# NOTE: uncomment once the fork builds` that sat under `rs-main` until Plan 9 Task 1 is
# the fossil of that misreading. There was nothing commented out and nothing to uncomment: the fork
# builds, the candidate is live, and the note described a state this file was never in.
#
# ## Verified on this machine at Plan 9 Task 1
#
# All **16 of 16** `exec` paths resolve. `{java}` resolves through `bench.paths.java_exe()` to
# `~/.gradle/jdks/eclipse_adoptium-25-aarch64-os_x.2/jdk-25.0.4.1+1/Contents/Home/bin/java`
# (openjdk 25.0.4.1 2026-08-18 LTS) — the same JDK that cut `tests/reference-frozen/`.
# `java-current` resolves **only** via the read-only Java clone's build output,
# `../../freerouting/build/libs/freerouting-current-executable.jar`; it is not a checked-in binary
# and a checkout without that clone built has no `java-current`. Every other jar is a committed
# file under `binaries/`, and `rs-main` is `../target/release/freerouting`, which `cargo build
# --release` produces.

[candidates.java-current]
kind = "java"
exec = ["{java}", "-Xmx4g", "-jar", "../../freerouting/build/libs/freerouting-current-executable.jar"]
sha_from = "../../freerouting"

[candidates."java-2.3.0"]
kind = "java"
exec = ["{java}", "-Xmx4g", "-jar", "binaries/freerouting-2.3.0.jar"]
sha = "v2.3.0"
version = "2.3.0"

[candidates.rs-main]
kind = "rust"
exec = ["../target/release/freerouting"]
sha_from = ".."

