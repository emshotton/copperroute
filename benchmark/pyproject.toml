[project]
name = "copperroute-bench"
version = "0.1.0"
description = "Comparison suite for copperroute and Java freerouting"
requires-python = ">=3.11"
dependencies = ["click>=8.1", "jinja2>=3.1"]

[project.scripts]
bench = "bench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs external tools (java jar, kicad)"]
