[workspace]
resolver = "3"
members = ["crates/*", "tests/parity"]
# copper-geometry-differential (the Java-vs-Rust differential harness) is its own
# workspace and is deliberately not a member — see scripts/differential/README.md.
exclude = ["scripts/differential/rust"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-only"
repository = "https://github.com/emshotton/copperroute"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"
num-traits = "0.2"
num-integer = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
similar = "2"

# `panic = "abort"` must stay unset: `AutorouteEngine::drill_page_drills` restores the drill-page
# grid through `catch_unwind` / `resume_unwind`.
#
# A `[profile.release]` in a `.cargo/config.toml` silently overrides this block.
[profile.release]
lto = "fat"
codegen-units = 1
debug = "line-tables-only"
