name: KiCad plugin

on:
  push:
    branches: [main]
    tags: ["kicad-plugin-v*"]
  pull_request:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || '' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  plugin-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and test the plugin against the real router
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin kicad-python pytest
          (cd bindings/python && maturin develop --release)
          pytest -q kicad-plugin/tests

  kicad-drc:
    runs-on: ubuntu-latest
    container: kicad/kicad:10.0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the CLI
        run: cargo build --release -p copperroute
      - name: Route the example boards and check them with KiCad's DRC
        run: |
          python3 kicad-plugin/scripts/check_with_kicad.py target/release/copperroute \
            web/examples/easyduino/nano.kicad_pcb \
            web/examples/easyduino/uno.kicad_pcb \
            web/examples/gb-hardware/gb-breakout.kicad_pcb \
            web/examples/kfchess/kfchess.kicad_pcb

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Plugin and Content Manager package
        run: |
          mkdir -p kicad-plugin/dist
          python3 kicad-plugin/scripts/build_package.py > repository-entry.json
          mv repository-entry.json kicad-plugin/dist/
      - uses: actions/upload-artifact@v4
        with:
          name: kicad-plugin-package
          path: kicad-plugin/dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/kicad-plugin-v')
    needs: [wheels, plugin-tests, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the wheels
        run: mkdir wheels && cp artifacts/wheel-*/*.whl wheels/
      - name: Publish the wheels to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels
          skip-existing: true
      - name: Attach the plugin package to the release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/kicad-plugin-package/*.zip
